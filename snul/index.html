<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="icon" type="image/jpeg" href="/favicon.jpeg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SNUL - Egypt's Premier Medical Devices Distribution Hub">
    <meta name="theme-color" content="#0C63B8">
    <title>SNUL — Medical Devices Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      /* Critical-path type only. Everything else comes from the design tokens
         (--font-sans/-display are both Arial), so this block deliberately does
         not re-declare the font stack for every selector. */
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
    <script>
      (function () {
        try {
          try {
            if (localStorage.getItem('snul-theme') !== 'light') localStorage.setItem('snul-theme', 'light')
          } catch (e) {}
          document.documentElement.dataset.theme = 'light'
          document.documentElement.classList.remove('dark')
          document.documentElement.style.colorScheme = 'light'
          var locale = localStorage.getItem('snul-locale')
          if (locale === 'ar') {
            document.documentElement.lang = 'ar'
            document.documentElement.dir = 'rtl'
          } else if (locale === 'en') {
            document.documentElement.lang = 'en'
            document.documentElement.dir = 'ltr'
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
