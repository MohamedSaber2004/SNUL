<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="icon" type="image/jpeg" href="/favicon.jpeg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SNUL - Egypt's Premier Medical Devices Distribution Hub">
    <meta name="theme-color" content="#1D4ED8">
    <title>SNUL — Medical Devices Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
      .font-display-lg { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight:700; letter-spacing:-0.02em; line-height:1.2; }
      .font-headline-lg { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight:600; letter-spacing:-0.015em; line-height:1.25; }
      .font-title-lg { font-family: 'Inter', system-ui, sans-serif; font-weight:600; }
      [dir='rtl'] { font-family: 'Cairo', system-ui, sans-serif; }
      [dir='rtl'] .font-display-lg, [dir='rtl'] .font-headline-lg, [dir='rtl'] .font-title-lg, [dir='rtl'] h1, [dir='rtl'] h2, [dir='rtl'] h3, [dir='rtl'] h4, [dir='rtl'] h5, [dir='rtl'] h6 { font-family: 'Cairo', system-ui, sans-serif; letter-spacing: normal; }
      .chain-line { position:relative; }
      .chain-line::before { content:''; position:absolute; left:0; right:0; top:50%; height:1px; background:linear-gradient(to right, #1D4ED8, #06B6D4); opacity:0.4; }
    </style>
    <script>
      (function () {
        try {
          try {
            if (localStorage.getItem('snul-theme') !== 'light') localStorage.setItem('snul-theme', 'light')
          } catch (e) {}
          document.documentElement.dataset.theme = 'light'
          document.documentElement.classList.remove('dark')
          document.documentElement.style.colorScheme = 'light'
          var locale = localStorage.getItem('snul-locale')
          if (locale === 'ar') {
            document.documentElement.lang = 'ar'
            document.documentElement.dir = 'rtl'
          } else if (locale === 'en') {
            document.documentElement.lang = 'en'
            document.documentElement.dir = 'ltr'
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
